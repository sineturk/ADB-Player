permissions:
  contents: read

jobs:
  validate:
    name: Source checks + Release x64
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Enable Windows Git long paths
        shell: powershell
        run: git config --global core.longpaths true

      - name: Checkout private development branch
        uses: actions/checkout@v4
        with:
          # The release solution lives under src/. Research evidence contains
          # deeply nested historical paths which exceed Windows checkout limits.
          sparse-checkout: |
            src
            tool
            native
            packaging
            docs
            .github
          sparse-checkout-cone-mode: true

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Generate secret-free CI build configuration
        shell: powershell
        # Public production service URLs, NOT credentials. No Neon database URL,
        # API master key, TMDB key, session token or password is bundled.
        env:
          ADB_CLOUD_AUTH_URL: https://ep-delicate-flower-b21al3ms.neonauth.c-6.eu-central-1.aws.neon.tech/neondb/auth
          ADB_CLOUD_API_URL: https://br-royal-hat-b2d0ig3y-adbcloudapi.compute.c-6.eu-central-1.aws.neon.tech/
        run: .\tool\generate-app-credentials.ps1 -OmitTelegramCredentials

      - name: Assert BYOC release ignores maintainer Telegram ID and HASH
        shell: powershell
        # Re-generating the file must preserve the separate public service URLs
        # needed by the later Neon/ADB Cloud source validation step.
        env:
          ADB_CLOUD_AUTH_URL: https://ep-delicate-flower-b21al3ms.neonauth.c-6.eu-central-1.aws.neon.tech/neondb/auth
          ADB_CLOUD_API_URL: https://br-royal-hat-b2d0ig3y-adbcloudapi.compute.c-6.eu-central-1.aws.neon.tech/
        run: |
          $env:TELEGRAM_API_ID = '123456'
          $env:TELEGRAM_API_HASH = ('a' * 32)
          .\tool\generate-app-credentials.ps1 -OmitTelegramCredentials
          $path = 'src\AltyaziDB.Player.Telegram\Generated\GeneratedTelegramCredentials.g.cs'
          $txt = [IO.File]::ReadAllText($path)
          if (-not $txt.Contains('public const int ApiId = 0;') -or
              -not $txt.Contains('public const string ApiHash = "";')) {
              throw 'Telegram API credentials must never be embedded in distribution builds.'
          }
          Remove-Item Env:\TELEGRAM_API_ID -ErrorAction SilentlyContinue
          Remove-Item Env:\TELEGRAM_API_HASH -ErrorAction SilentlyContinue

