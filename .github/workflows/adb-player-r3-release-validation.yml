      - name: Restore NuGet packages
        shell: powershell
        run: dotnet restore .\AltyaziDB.Player.Windows.sln --configfile .\NuGet.Config -p:Platform=x64

      - name: Build Windows Release x64
        shell: powershell
        run: dotnet build .\AltyaziDB.Player.Windows.sln --configuration Release --no-restore -p:Platform=x64

      - name: Validate preview runtime payload and SHA-256
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          . .\tool\common.ps1
          $root = (Get-Location).Path
          $bin = Join-Path $root 'src\AltyaziDB.Player.App\bin\x64\Release\net10.0-windows\win-x64'
          $exe = Join-Path $bin 'ADB.Player.exe'
          if (!(Test-Path -LiteralPath $exe)) { throw 'Release EXE missing.' }
          Copy-LibMpvNativeRuntime -Destination $bin -Required | Out-Null
          $mpv = Get-ChildItem -LiteralPath $bin -File | Where-Object { $_.Name -in @('libmpv-2.dll','mpv-2.dll','libmpv.dll') } | Select-Object -First 1
          if (!$mpv) { throw 'libmpv runtime missing in preview build.' }
          $hash = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash
          Set-Content -LiteralPath (Join-Path $bin 'ADB.Player.exe.sha256.txt') -Value "$hash  ADB.Player.exe" -Encoding Ascii
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "### ADB Player R5 P4.1-P4.3 Cinematic Pages Release x64 source build"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ("- Commit: " + $env:GITHUB_SHA)
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- Configuration: Release x64, win-x64, framework dependent"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- libmpv: $($mpv.Name)"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ("- SHA-256: " + $hash)
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- Test mode: source build only; CI cannot verify interactive video playback or on-screen WPF layout."

      - name: Upload private test build (not a public release)
