name: Windows source build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Generate secret-free build configuration
        shell: powershell
        run: .\tool\generate-app-credentials.ps1

      - name: Restore
        shell: powershell
        run: dotnet restore .\AltyaziDB.Player.Windows.sln --configfile .\NuGet.Config

      - name: Build Release
        shell: powershell
        run: dotnet build .\AltyaziDB.Player.Windows.sln --configuration Release --no-restore -p:Platform=x64

      - name: Public source verification
        shell: powershell
        run: .\tool\verify-public-source.ps1
